# Publishes web/ to GitHub Pages (https://datacenters.rooted.wang; the custom domain
# lives in the repo's Pages settings). Redeploys when web/ changes on main and after
# each data refresh: refresh-data pushes with GITHUB_TOKEN, which doesn't fire push
# workflows, so workflow_run picks those commits up.
name: pages
on:
  push:
    branches: [main]
    paths: ['web/**']
  workflow_run:
    workflows: [refresh-data]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: pages
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - id: d
        uses: actions/deploy-pages@v4
